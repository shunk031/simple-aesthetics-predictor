[project]
name = "simple-aesthetics-predictor"
version = "0.2.0"
description = "A simple transformers wrapper for aesthetics prediction."
readme = "README.md"
authors = [
    { name = "Shunsuke KITADA", email = "shunsuke.kitada.0831@gmail.com" },
]
requires-python = ">=3.10"
dependencies = ["transformers[torch,vision]>=4.6.0"]

[project.urls]
Repository = "https://github.com/shunk031/simple-aesthetics-predictor"

[project.optional-dependencies]
tips = ["hpsv2>=1.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.0.0",
 "pytest>=6.0.0",
 "ruff>=0.1.5",
 "types-requests>=2.32.4.20250611",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aesthetics_predictor"]
